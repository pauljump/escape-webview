<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Opening…</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#0b0b0c;color:#f4f4f5}
  a{color:inherit}
  .fallback{max-width:340px;padding:24px;text-align:center;font-size:14px;line-height:1.5;opacity:.8}
</style>
</head>
<body>
  <!-- Shown only if JS is off or the target is missing/invalid. -->
  <div class="fallback">
    <p id="msg">Redirecting you to your browser…</p>
    <p><a id="raw" href="#">Continue</a></p>
  </div>

  <script>
  /* ----------------------------------------------------------------------
   * Deploy this folder to any static host (Cloudflare Pages, GitHub Pages,
   * Netlify, Vercel...). Then share links like:
   *
   *     https://go.yoursite.com/?u=https://yoursite.com/post
   *
   * Optional params:
   *     &name=Your%20Site           label shown in the card
   *     &app_ios=https://...        deep link / universal link (iOS)
   *     &app_android=https://...    deep link / universal link (Android)
   * -------------------------------------------------------------------- */

  // OPEN-REDIRECT GUARD: list the hostnames you actually link to.
  // Leave [] to allow any https target (fine for personal use; risky if public).
  var ALLOW_HOSTS = [];

  var q = new URLSearchParams(location.search);
  var target = q.get('u') || q.get('url') || '';

  function valid(u) {
    try {
      var p = new URL(u);
      if (p.protocol !== 'http:' && p.protocol !== 'https:') return false;
      if (ALLOW_HOSTS.length && ALLOW_HOSTS.indexOf(p.hostname) === -1) return false;
      return true;
    } catch (e) { return false; }
  }

  if (!valid(target)) {
    document.getElementById('msg').textContent =
      'This link is missing a valid ?u= destination.';
    document.getElementById('raw').style.display = 'none';
  } else {
    document.getElementById('raw').href = target;
    // Load the widget from the same deploy.
    var s = document.createElement('script');
    s.src = '../src/escape-hatch.js';   // adjust if you host the widget elsewhere
    s.setAttribute('data-manual', '');
    s.onload = function () {
      if (window.EscapeHatch && window.EscapeHatch.isInApp()) {
        window.EscapeHatch.init({
          url: target,
          name: q.get('name'),
          app: (q.get('app_ios') || q.get('app_android'))
            ? { ios: q.get('app_ios'), android: q.get('app_android') } : null
        });
      } else {
        location.replace(target);       // normal browser: just go
      }
    };
    s.onerror = function () { location.replace(target); };
    document.head.appendChild(s);
  }
  </script>
</body>
</html>
